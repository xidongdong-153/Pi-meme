name: 完整测试

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-sandbox
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        uses: ./.github/actions/check-code
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm test:all
      - if: runner.os == 'macOS'
        run: pnpm test --all --layer unit,component,integration,artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: out/tests/
          retention-days: 7
