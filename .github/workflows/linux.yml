name: Linux Host 与 Web

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: ./.github/actions/setup-linux-sandbox
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm check-boundaries
      - run: pnpm test --all --layer unit,component,integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-reports
          path: out/tests/
          retention-days: 7
